info:
  name: register
  type: http
  seq: 2

http:
  method: POST
  url: "{{localurl}}/api/auth/register"
  auth: none
  headers:
    - name: Content-Type
      value: application/json
  body:
    mode: json
    payload: |
      {
        "name": "John Doe",
        "email": "john@example.com",
        "password": "password123",
        "role": "CUSTOMER"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
