info:
  name: register
  type: http
  seq: 2

http:
  method: POST
  url: "{{localurl}}/api/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "John Doe",
        "email": "{{customerEmail}}",
        "password": "{{password}}",
        "role": "CUSTOMER"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
