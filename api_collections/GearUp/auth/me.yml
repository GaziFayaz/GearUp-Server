info:
  name: getMe
  type: http
  seq: 4

http:
  method: GET
  url: "{{localurl}}/api/auth/me"
  auth: bearer
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"

runtime:
  variables:
    - name: accessToken
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
