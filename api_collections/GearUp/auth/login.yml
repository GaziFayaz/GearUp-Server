info:
  name: login
  type: http
  seq: 3

http:
  method: POST
  url: "{{localurl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    mode: json
    payload: |
      {
        "email": "{{customerEmail}}",
        "password": "{{password}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
