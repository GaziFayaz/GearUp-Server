info:
  name: createGear
  type: http
  seq: 7

http:
  method: POST
  url: "{{localurl}}/api/provider/gear"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{providerToken}}"
  body:
    type: json
    data: |-
      {
        "name": "Road Bike Elite",
        "description": "Carbon fiber road bike for racing",
        "brand": "Specialized",
        "pricePerDay": 50.00,
        "stockQuantity": 4,
        "categoryId": "{{category1Id}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
