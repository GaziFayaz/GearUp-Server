http:
  method: POST
  url: "{{localurl}}/api/reviews"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{customerToken}}"
  body:
    type: json
    data: |-
      {
        "gearItemId": "{{gear2Id}}",
        "rentalId": "{{rental1Id}}",
        "rating": 4,
        "comment": "Great tent, very spacious!"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
